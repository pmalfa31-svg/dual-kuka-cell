env:
  xml_path: "assets/scene.xml"
  frame_skip: 5           # 500 Hz physics -> 100 Hz RL control loop (dt = 0.01s)
  max_episode_steps: 1200 # 12 secondi (permette la circolazione completa del nastro)
  max_delta_q: 0.05
  conveyor_speed: 0.6

reward_weights:
  w_reach: 3.0
  w_grasp: 25.0
  w_transport: 4.0
  w_success: 120.0
  p_collision: 50.0
  p_energy: 0.005

pallet_targets:
  robot_1: [0.8, 1.3, 0.25]
  robot_2: [-0.8, -1.3, 0.25]
