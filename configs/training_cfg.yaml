env:
  xml_path: "assets/scene.xml"
  frame_skip: 5           # 500 Hz physics -> 100 Hz RL control loop (dt = 0.01s)
  max_episode_steps: 600  # 6 secondi di simulazione per episodio
  max_delta_q: 0.05       # Max variazione angolare per step (rad)
  conveyor_speed: 0.6

reward_weights:
  w_reach: 2.0
  w_grasp: 15.0
  w_transport: 3.0
  w_success: 100.0
  p_collision: 50.0
  p_energy: 0.01

pallet_targets:
  robot_1: [0.8, 1.3, 0.25]
  robot_2: [-0.8, -1.3, 0.25]
