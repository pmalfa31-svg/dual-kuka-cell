env:
  xml_path: "assets/scene.xml"
  frame_skip: 5           # 500 Hz fisica -> 100 Hz RL (dt = 0.01s)
  max_episode_steps: 1500 # 15 secondi
  max_delta_q: 0.05
  conveyor_speed: 0.6

reward_weights:
  w_reach: 3.0            # Gradiente costante di avvicinamento al collo
  w_grasp: 25.0           # Bonus durante il mantenimento in volo
  w_transport: 4.0        # Gradiente di trasporto verso il pallet
  w_success: 150.0        # Bonus deposito sul pallet
  p_collision: 50.0
  p_energy: 0.001

pallet_targets:
  robot_1: [0.8, 1.3, 0.25]
  robot_2: [-0.8, -1.3, 0.25]
